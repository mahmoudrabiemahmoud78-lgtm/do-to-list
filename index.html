<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-list</title>
    <link rel="stylesheet" href="style.css">

   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        
    </style>
</head>
<body>
    <div id="contian">
        <div id="cintain-top">
            <div id="top-div-one">
                <h1><span><i class="fa-solid fa-circle-check"></i></span> my tasks</h1>
            </div>
            
            <div id="top-div-two">
                <h1><span><i class="fa-solid fa-list-check"></i></span> all tasks  </h1>
                <h1><span><i class="fa-solid fa-calendar-day"></i></span> today </h1>
                <h1><span><i class="fa-regular fa-circle-check"></i></span> completed </h1>
                <h1><span><i class="fa-solid fa-trash-can"></i></span> trash </h1>

            
            </div>


            <div id="top-div-three">
                <button id="btndark"><span><i class="fa-solid fa-moon"></i></span>   dark</button>
                <button id="btnlight"><span><i class="fa-solid fa-sun"></i></span> light </button>   
            </div>
        </div>


        <div id="cintain-down">
            <div id="down-div-one">
                <h1>to do list </h1>
                <p>plan your day and get things done 🌟🌟🌟</p>
            </div>


            <div id="down-div-two">
                <div>
                    <input id="inputtext" type="text" placeholder="what do you need to do?">
                    <button id="btnsend">send</button>
                </div>
            </div>
            <div id="down-div-three">
                <h4>tasks</h4>
                
            </div>


            <div id="down-div-four">

              
               <div  id="dfo">
                    <div>
                        <input type="checkbox" name="" id="" >
                        <h3>clean your room</h3>
                    </div>
                    <span><i class="fa-solid fa-trash-can"></i></span>
               </div>
            </div>
            <div id="down-div-five">
                <p>small steps every day 💜</p>
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>

    
</body>
</html>
